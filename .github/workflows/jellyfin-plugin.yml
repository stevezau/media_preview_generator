name: Jellyfin Plugin — build, release, publish manifest

on:
  push:
    tags:
      - "plugin-v*.*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "10.11 build version (e.g. 10.11.1.0); the 12.0 build becomes 12.0.<last two parts>. Leave blank to use the .csproj's 10.11 <Version>."
        required: false
        default: ""

# Two jobs run in sequence:
#   1. build-release → one row per Jellyfin ABI (10.11/net9, 12.0/net10):
#      DLL + zip + attachment on ONE GitHub release (tag plugin-v<10.11 version>)
#   2. publish-site  → calls docs.yml, which builds the docs site from
#      `dev`, rebuilds jellyfin-plugin/manifest.json from every plugin-v*
#      release (failing unless this one is listed with both zips) and
#      deploys both via the official Pages
#      Actions API (no branch push, so repo branch-protection rules don't
#      apply). A Pages deploy replaces the whole site, so the manifest and
#      the docs always ship together. Any later docs deploy builds the same
#      manifest, so if this deploy is cancelled or fails, the next one
#      still lists the new versions. Requires Pages → "Build and deployment"
#      set to "GitHub Actions" once in the repo settings.
permissions:
  contents: write
  pages: write
  id-token: write

# Stops two tag pushes / dispatches from racing each other's release uploads.
# The Pages deploy itself is serialised with docs-only deploys by the
# job-level `pages` group inside docs.yml. Don't use `pages` here too:
# the same group at caller and callee level deadlocks.
concurrency:
  group: jellyfin-plugin
  cancel-in-progress: false

jobs:
  build-release:
    name: Build for Jellyfin ${{ matrix.abi }}
    runs-on: ubuntu-latest
    strategy:
      # Rows run one at a time: both attach to the same GitHub release, and two
      # parallel "create release" calls race each other.
      max-parallel: 1
      matrix:
        include:
          - abi: "10.11"
            dotnet: "9.0.x"
            tfm: "net9.0"
          - abi: "12.0"
            dotnet: "10.0.x"
            tfm: "net10.0"
    # Both rows write the same value.
    outputs:
      release_version: ${{ steps.ver.outputs.release_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET ${{ matrix.dotnet }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ matrix.dotnet }}

      - name: Resolve version
        id: ver
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
          ABI: ${{ matrix.abi }}
        run: |
          set -euo pipefail
          REF_TAG="${GITHUB_REF##*/}"
          if [[ -n "$INPUT_VERSION" ]]; then
            VERSION="$INPUT_VERSION"
          elif [[ "$REF_TAG" == plugin-v* ]]; then
            VERSION="${REF_TAG#plugin-v}"
          else
            VERSION=$(grep -oP '<Version>\K10\.11\.[^<]+' jellyfin-plugin/Jellyfin.Plugin.MediaPreviewBridge.csproj)
          fi
          # The tag names the 10.11 build; the 12.0 build is derived from it.
          if [[ ! "$VERSION" =~ ^10\.11\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Plugin version must look like 10.11.X.Y (got '$VERSION')"
            exit 1
          fi
          if [[ "$ABI" == "10.11" ]]; then
            ROW_VERSION="$VERSION"
          else
            ROW_VERSION="12.0.$(echo "$VERSION" | cut -d. -f3-4)"
          fi
          echo "release_version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "row_version=$ROW_VERSION" >> "$GITHUB_OUTPUT"
          echo "Release $VERSION → Jellyfin $ABI build $ROW_VERSION"

      - name: Build
        working-directory: jellyfin-plugin
        env:
          ABI: ${{ matrix.abi }}
          ROW_VERSION: ${{ steps.ver.outputs.row_version }}
        run: |
          set -euo pipefail
          dotnet restore -p:JellyfinAbi="$ABI"
          dotnet build -c Release --no-restore \
            -p:JellyfinAbi="$ABI" \
            -p:Version="$ROW_VERSION" \
            -p:FileVersion="$ROW_VERSION" \
            -p:AssemblyVersion="$ROW_VERSION"

      - name: Pack zip
        id: pack
        working-directory: jellyfin-plugin
        env:
          TFM: ${{ matrix.tfm }}
          ROW_VERSION: ${{ steps.ver.outputs.row_version }}
        run: |
          set -euo pipefail
          ZIP="media-preview-bridge_${ROW_VERSION}.zip"
          (cd "bin/Release/$TFM" && zip -j "../../../$ZIP" Jellyfin.Plugin.MediaPreviewBridge.dll)
          # For the job summary only. The manifest's MD5 is recomputed from the uploaded release asset by
          # scripts/build_jellyfin_manifest.py (which explains why Jellyfin needs MD5).
          CHECKSUM=$(md5sum "$ZIP" | awk '{print toupper($1)}')
          {
            echo "zip=$ZIP"
            echo "checksum=$CHECKSUM"
          } >> "$GITHUB_OUTPUT"
          echo "$ZIP → MD5 $CHECKSUM"

      - name: Create / update GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: plugin-v${{ steps.ver.outputs.release_version }}
          # A manual run creates the tag; without this GitHub puts it on the default branch's head, not on the
          # commit these DLLs were built from.
          target_commitish: ${{ github.sha }}
          # The app's update check reads /releases/latest; a plugin release must never become "latest".
          make_latest: false
          name: "Media Preview Bridge ${{ steps.ver.outputs.release_version }}"
          body: |
            Jellyfin plugin DLLs — install via Jellyfin admin → Plugins → Repositories.
            Two builds: `10.11.x` for Jellyfin 10.11 and `12.0.x` for Jellyfin 12.0; Jellyfin picks the right one.

            Repository URL (paste this once):
            `https://mediapreviewgenerator.dev/jellyfin-plugin/manifest.json`

            Once the repo is added, **Media Preview Bridge** appears in
            the catalogue and updates automatically.
          files: jellyfin-plugin/${{ steps.pack.outputs.zip }}
          fail_on_unmatched_files: true

      - name: Summary
        env:
          ABI: ${{ matrix.abi }}
          RELEASE_VERSION: ${{ steps.ver.outputs.release_version }}
          ROW_VERSION: ${{ steps.ver.outputs.row_version }}
          CHECKSUM: ${{ steps.pack.outputs.checksum }}
          REPOSITORY: ${{ github.repository }}
        run: |
          {
            echo "## Media Preview Bridge $RELEASE_VERSION: Jellyfin $ABI build published"
            echo ""
            echo "- Release: https://github.com/$REPOSITORY/releases/tag/plugin-v$RELEASE_VERSION"
            echo "- Manifest: https://mediapreviewgenerator.dev/jellyfin-plugin/manifest.json (deployed by the publish-site job)"
            echo "- Jellyfin $ABI build $ROW_VERSION: MD5 \`$CHECKSUM\`"
          } >> "$GITHUB_STEP_SUMMARY"

  publish-site:
    needs: build-release
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/docs.yml
    with:
      docs_ref: dev
      # The deploy fails unless this release is in the manifest with both zips, so a renamed zip or tag
      # can't let the release go green while Jellyfin users never see it.
      require_tag: plugin-v${{ needs.build-release.outputs.release_version }}
