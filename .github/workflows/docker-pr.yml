name: Build PR Docker Image

on:
  pull_request_target:
    types: [labeled, synchronize, reopened]
    branches: [main, dev]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - 'LICENSE'
      - 'unraid-templates/**'
      - 'docker-compose.example.yml'

env:
  REGISTRY: ghcr.io

concurrency:
  group: docker-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    # Gate: only run when the `build-docker` label is present.
    # - For `labeled` events, check the label that was just added.
    # - For `synchronize`/`reopened` events, check the PR's current label set.
    # This is the standard mitigation for `pull_request_target` running fork code:
    # a maintainer must review the diff and apply the label before any build runs.
    if: >-
      (github.event.action == 'labeled' && github.event.label.name == 'build-docker') ||
      ((github.event.action == 'synchronize' || github.event.action == 'reopened') &&
       contains(github.event.pull_request.labels.*.name, 'build-docker'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      pull-requests: write
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          # CRITICAL: pull_request_target defaults to the base branch. We must
          # explicitly check out the PR head SHA to actually build the contributor's code.
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0  # Full history for setuptools-scm versioning

      - name: Compute lowercase image name
        id: img
        run: echo "name=${REPO,,}" >> "$GITHUB_OUTPUT"
        env:
          REPO: ${{ github.repository }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          # BuildKit's image and Docker Hub base images come through Google's Docker Hub mirror: setup-buildx pulls
          # BuildKit before any login, and anonymous pulls from shared runners hit Docker Hub's rate limit (429).
          driver-opts: image=mirror.gcr.io/moby/buildkit:buildx-stable-1
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push PR image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ env.REGISTRY }}/${{ steps.img.outputs.name }}:pr-${{ github.event.pull_request.number }}
          build-args: |
            GIT_BRANCH=pr-${{ github.event.pull_request.number }}
            GIT_SHA=${{ github.event.pull_request.head.sha }}
          # No GHA layer cache: since GitHub's 2026 cache hardening, pull_request_target runs on the default
          # branch get a read-only cache token ("refs/heads/dev: read"), so cache-to fails the whole build with
          # "failed to reserve cache" and nothing could ever be written for cache-from to read.

      - name: The patched loudness analyser runs and carries its source
        env:
          CHECK_IMAGE: ${{ env.REGISTRY }}/${{ steps.img.outputs.name }}:pr-${{ github.event.pull_request.number }}
        run: |
          docker run --rm -i --entrypoint python3 "$CHECK_IMAGE" - <<'PY'
          from pathlib import Path
          import subprocess
          from media_preview_generator.loudness.analyze import resolve_ffmpeg

          root = Path("/opt/ffmpeg-loudness")
          binary = root / "bin/ffmpeg"
          for name in ("ffmpeg-8.1.2.tar.xz", "ebur128.patch", "README.md", "configure-args.txt"):
              assert (root / "share/source" / name).is_file(), name
              assert (root / "share/source" / name).stat().st_size > 0, name
          assert resolve_ffmpeg("/usr/lib/jellyfin-ffmpeg/ffmpeg") == str(binary)
          subprocess.run([str(binary), "-version"], check=True, stdout=subprocess.DEVNULL)
          filters = subprocess.run([str(binary), "-filters"], check=True, capture_output=True, text=True)
          assert " loudnorm " in filters.stdout
          PY

      - name: Post/update sticky PR comment
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: pr-docker-image
          message: |
            ## PR Docker image ready

            ```bash
            docker pull ${{ env.REGISTRY }}/${{ steps.img.outputs.name }}:pr-${{ github.event.pull_request.number }}
            ```

            - Tag: `pr-${{ github.event.pull_request.number }}` — **overwritten in place** on every commit to this PR, so always pulling this tag gets the latest head.
            - Built from commit: `${{ github.event.pull_request.head.sha }}`
            - Platform: `linux/amd64`
            - Image is automatically deleted when this PR is closed.
