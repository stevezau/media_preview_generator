name: Docs site — build and deploy to GitHub Pages

# The ONE workflow that deploys GitHub Pages. A Pages deploy replaces the whole site, and
# the site also serves the Jellyfin plugin repository manifest that every Jellyfin install
# of Media Preview Bridge polls:
#   https://mediapreviewgenerator.dev/jellyfin-plugin/manifest.json
# So every deploy ships the docs AND a manifest, and every deploy (push to dev, manual run, or
# called by jellyfin-plugin.yml, which must ship the docs too or it would wipe them) rebuilds that
# manifest from the plugin-v* GitHub releases with scripts/build_jellyfin_manifest.py.
# If the manifest can't be built the job fails before deploying anything.

on:
  push:
    branches: [dev]
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
      # A builder change deploys at once, so it's exercised on its own push. The template needn't
      # trigger: the builder reads it at the newest plugin-v* tag, so dev edits wait for a release.
      - "scripts/build_jellyfin_manifest.py"
  workflow_dispatch:
  workflow_call:
    inputs:
      docs_ref:
        description: "Git ref to build the docs from. Empty = the triggering ref."
        type: string
        required: false
        default: ""

permissions: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    # Every deploy builds the same manifest from the releases, so when GitHub cancels a
    # pending deploy because a newer one queued, nothing is lost: the newer one lists the
    # releases when it runs. Job-level (not workflow-level) so a caller holding its own
    # workflow-level group can't deadlock.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.docs_ref || github.ref }}

      - name: Setup Python
        # Only for the manifest builder below; the site itself is Jekyll.
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Ruby
        # Ruby version from docs/.ruby-version; gems from docs/Gemfile.lock, cached.
        uses: ruby/setup-ruby@v1
        with:
          working-directory: docs
          bundler-cache: true

      - name: Build site
        working-directory: docs
        env:
          JEKYLL_ENV: production
        run: bundle exec jekyll build --destination ../site

      - name: Build Jellyfin plugin manifest from releases
        # Exits non-zero, so nothing deploys, on an API or download error, a digest mismatch,
        # a malformed template or zero versions.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          readonly target="site/jellyfin-plugin/manifest.json"
          if [[ -e "$target" ]]; then
            echo "::error::The docs build produced $target itself; it must only come from build_jellyfin_manifest.py."
            exit 1
          fi
          mkdir -p "$(dirname "$target")"
          python scripts/build_jellyfin_manifest.py --repo "$GITHUB_REPOSITORY" \
            --template jellyfin-plugin/manifest.template.json --out "$target"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4

      - name: Summary
        env:
          PAGE_URL: ${{ steps.deploy.outputs.page_url }}
        run: |
          set -euo pipefail
          readonly manifest="site/jellyfin-plugin/manifest.json"
          count=$(jq '.[0].versions | length' "$manifest")
          newest=$(jq -r '.[0].versions[0].version' "$manifest")
          {
            echo "## Docs site deployed"
            echo ""
            echo "- Site: $PAGE_URL"
            echo "- Jellyfin manifest: $count version(s) from the plugin-v* releases, newest $newest"
          } >> "$GITHUB_STEP_SUMMARY"
