        <!-- Quiet Hours (D21 + D26) — global queue pause / resume, multi-window with per-day filter -->
        <div class="card section-card" id="section-worker-quiet-hours">
            <div role="heading" aria-level="2" class="card-header">
                <i class="bi bi-moon-stars sec-ico" aria-hidden="true"></i>
                <div class="sec-title">
                    <span class="sec-name">Global pause schedule
                        <button type="button" class="info-icon ms-1" tabindex="0" data-bs-toggle="tooltip" data-bs-placement="top" title="Pause all processing at set times. Scheduled runs during a global pause are skipped." data-explain-title="Global pause schedule" data-explain-template="infoPauseRulesTpl"><i class="bi bi-info-circle"></i></button>
                    </span>
                    <span class="sec-desc">Pause all processing, including current files (Quiet Hours).</span>
                </div>
                <span class="badge bg-secondary ms-auto" id="quietHoursStateBadge" title="Whether the queue is currently paused by quiet hours">off</span>
            </div>
            <div class="card-body">
                <template id="infoPauseRulesTpl">
                    <p>Scheduled runs during a global pause are skipped; manual and webhook jobs may queue. Missed scheduled runs are not caught up automatically. Windows are saved but not applied while the schedule is off.</p>
                </template>
                <div class="setting-row">
                    <div class="sr-label">
                        <label for="quietHoursEnabled" class="sr-title">Enable quiet hours</label>
                        <div class="sr-hint" id="quietHoursNextHint">Applied when on.</div>
                    </div>
                    <div class="sr-control">
                        <div class="form-check form-switch">
                            <input class="form-check-input" type="checkbox" role="switch" id="quietHoursEnabled">
                        </div>
                    </div>
                </div>

                <div class="week-card" id="pauseWeekCard">
                    <div class="week-head">
                        <strong>Pause windows this week</strong>
                        <span class="week-tz" data-week-tz></span>
                    </div>
                    <div id="pauseWeekGraph"></div>
                    <div class="week-legend"><span><i class="swatch swatch-pause"></i>Paused</span><span><i class="swatch swatch-now"></i>Now</span></div>
                </div>

                <div id="quietHoursWindows"></div>
                <div class="form-actions form-actions-split">
                    <button type="button" class="btn btn-sm btn-outline-secondary" id="quietHoursAddWindowBtn">
                        <i class="bi bi-plus me-1"></i>Add window
                    </button>
                    <span class="flex-fill"></span>
                    <span class="sr-hint">This section has its own Save.</span>
                    <button type="button" class="btn btn-sm btn-primary" id="quietHoursSaveBtn">
                        <i class="bi bi-check me-1"></i>Save
                    </button>
                </div>
                <div class="hint-line">
                    <i class="bi bi-info-circle" aria-hidden="true"></i>
                    <span>Times use the app timezone; days select when a window starts. <button type="button" class="info-icon ms-1" tabindex="0" data-bs-toggle="tooltip" data-bs-placement="top" title="Overnight windows, upgrades, Pause All and what group hours stop." data-explain-title="Pause schedule" data-explain-template="infoQuietHoursTpl"><i class="bi bi-info-circle"></i></button>
<template id="infoQuietHoursTpl">
    <p>Times use the app timezone. Days select when a window starts: Monday 23:00–07:00 ends Tuesday. Existing windows were preserved on upgrade. Manual Pause All stays active until you resume it; opening worker groups does not clear it. Group hours only stop new files and let current work finish.</p>
</template>
</span>
                </div>
            </div>
        </div>

        <!-- D26 — Quiet Hours window row template (cloned by JS) -->

        </template>
