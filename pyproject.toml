[build-system]
requires = ["setuptools>=64", "wheel", "setuptools-scm[toml]>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "media-preview-generator"
dynamic = ["version"]
authors = [
    {name = "Steve Adams", email = "stevezau@gmail.com"},
]
description = "GPU-accelerated video preview thumbnail generation for Plex, Emby, and Jellyfin media servers"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Video",
    "Topic :: System :: Archiving",
]
keywords = ["plex", "emby", "jellyfin", "media-server", "video", "thumbnails", "previews", "trickplay", "bif", "ffmpeg", "gpu", "acceleration"]
dependencies = [
    "requests==2.33.0",
    # urllib3 >=2.6.3 covers CVE-2025-50181/50182 (redirect-handling),
    # CVE-2025-66418/66471 (chunked encoding), CVE-2026-21441
    # (proxy-auth). python>=3.11 is already required so dropping 1.x
    # support is safe.
    "urllib3>=2.6.3,<3.0.0",
    # python-dotenv >=1.2.2 covers CVE-2026-28684.
    "python-dotenv>=1.2.2,<2",
    "plexapi==4.17.1",
    "loguru==0.7.3",
    "rich>=13.9,<14",
    "pymediainfo==7.0.1",
    "flask>=3.0.0,<4",
    "werkzeug>=3.0.0,<3.1.7",  # 3.1.7 rejects underscores in Host header, breaks Docker hostnames (#196)
    "flask-wtf>=1.2.0,<2",
    "flask-socketio>=5.3.0,<6",
    "flask-cors>=6.0.0,<7",  # 6.0.0 patches CVE-2024-6866 (case-insensitive path match)
    "flask-limiter>=3.5.0,<4",
    "apscheduler>=3.10.0,<4",
    "gunicorn>=22.0.0,<24",
    "sqlalchemy>=2.0.0,<3",
    # Pillow is used by JellyfinTrickplayAdapter to pack frame JPGs into
    # 10x10 tile sheets (Jellyfin 10.9+ native trickplay format).
    # >=12.2.0 covers CVE-2026-25990 and CVE-2026-40192.
    "pillow>=12.2.0,<14",
    # numpy vectorises the season intro matcher (markers/audio/matcher.py); imported only by Intro & Credits.
    "numpy>=2.0,<3",
    # Credit text detection (markers/credits/textdet.py). Imported only by its helper process, never by the web app.
    "onnxruntime==1.30.0",
    # x86_64 only: the WebGPU plugin publishes no Linux aarch64 wheel, so the arm64 image (and any arm64 install)
    # detects text on the CPU.
    "onnxruntime-ep-webgpu==0.3.0; platform_machine == 'x86_64'",
    "opencv-python-headless==5.0.0.93",
    "pyclipper==1.4.0",
]

[project.optional-dependencies]
nvidia = ["pynvml==11.6.0"]
amd = ["amdsmi==6.2.1"]
test = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-mock>=3.10.0",
    "pytest-xdist>=3.0.0",
    "pytest-timeout>=2.3.0",
    "pytest-playwright>=0.4.0",
    # Auto-retry Chromium-and-runner-induced flakes on CI. Sharding
    # (see pytest-shard below) handles the Chromium SIGSEGV-class
    # accumulation flakes by giving each shard a fresh runner. But
    # a separate flake class — "element is not stable" wizard
    # transitions on GH's slow CPU — needs up to 3 attempts to
    # clear. ``--reruns 2`` (set in ci.yml) covers both classes;
    # 3 consecutive failures still flag real regressions. Local
    # runs (32-core box) pass without reruns.
    "pytest-rerunfailures>=14.0",
    # Shard the e2e suite across multiple GH Actions jobs. Each
    # shard runs an independent ubuntu-latest runner = fresh
    # Chromium, fresh memory budget, so no cross-test state
    # accumulation can trigger the known Playwright-on-small-CI
    # Chromium crash pattern (playwright#34075). 4-shard split
    # gives ~100-107 tests/shard (411 ÷ 4, measured 103/107/100/101);
    # the suite has outgrown the empirical ~30-test threshold the
    # split was sized for, so the fresh runner per shard — not the
    # shard size — is what bounds memory accumulation now.
    "pytest-shard>=0.1.2",
    "playwright>=1.40.0",
    "flask-cors>=6.0.0,<7",
    # vcrpy + pytest-recording for vendor-API contract cassettes.
    # Records real HTTP request/response shapes against live Plex / Emby /
    # Jellyfin to YAML cassettes; replays in CI so tests run offline AND
    # catch contract drift (missing query params, response shape changes,
    # status code regressions). Caught the production "Plex 500s when
    # type= is omitted" bug that the mock-based unit test missed.
    "pytest-recording>=0.13.0",
    "vcrpy>=6.0.0",
    # tests/markers/credits/rapidocr_reference.py: the verbatim rapidocr post-processing uses shapely.
    "shapely==2.1.2",
    # tests/test_docs_site.py builds the docs site; CI installs only `.[test]`.
    "media-preview-generator[docs]",
]
# Docs site (mkdocs.yml). docs.yml installs exactly this list. mkdocs is capped below 2.0:
# Material for MkDocs does not support MkDocs 2.0's rewritten plugin/theme system.
docs = [
    "mkdocs>=1.6.1,<2",
    "mkdocs-material>=9.7.7,<10",
    "markdown-callouts>=0.4.0,<0.5",
]
dev = [
    "media-preview-generator[test]",
    "ruff>=0.6.0",
    "pre-commit>=3.6.0",
    "httpie>=3.2.0",
]

[project.urls]
Homepage = "https://github.com/stevezau/media_preview_generator"
Repository = "https://github.com/stevezau/media_preview_generator"
Issues = "https://github.com/stevezau/media_preview_generator/issues"
Documentation = "https://mediapreviewgenerator.dev/"

[tool.setuptools.packages.find]
where = ["."]
include = ["media_preview_generator*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "--cov=media_preview_generator",
    # The Plex marker agent ships in its own folder, outside the package, but tests/test_plex_marker_agent.py
    # covers it like any other module — without this its lines counted towards nothing at all.
    "--cov=plex-marker-agent",
    "--cov-report=term-missing",
    "--cov-fail-under=70",
    "--tb=short",
    "--strict-markers",
    "--disable-warnings",
    "-n", "auto",
    "--dist", "worksteal",
    "-m", "not gpu and not e2e and not integration",
    "--timeout=30",
    "--timeout-method=thread",
]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
# A run writes ~1.3 GB of tmp_path dirs; pytest keeps the last 3 runs by default, which fills
# /dev/shm (64 MB default in Docker, and finite even on a real RAM disk) fast.
tmp_path_retention_count = 1
markers = [
    "integration: marks tests as integration tests",
    "real_plex_server: tests that require a live Plex server (opt out of the global Plex mock)",
    "real_gpu_detection: tests that require real GPU detection (opt out of the global GPU mock)",
    "gpu: marks tests that require GPU hardware",
    "plex: marks tests that require Plex server connection",
    "slow: marks tests as slow running",
    "ci: marks tests that work in CI environments",
    "e2e: marks tests as end-to-end browser tests",
    "real_prewarm: opt out of the autouse _prewarm_caches no-op in conftest",
    "real_logging: opt out of the autouse setup_logging no-op in conftest",
    "real_job_async: opt out of the autouse _start_job_async no-op in conftest",
    "journey: cross-module integration journey tests (light unit-of-the-seam style)",
    "vcr: vendor-API contract tests that replay recorded HTTP cassettes (no live server needed)",
    "vcr_record: tests that re-record cassettes against a live server when run with --record-mode=once (skipped by default in CI)",
]

[tool.coverage.run]
source = ["media_preview_generator", "plex-marker-agent"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/venv/*",
    "*/test_env/*"
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false

[tool.setuptools_scm]
write_to = "media_preview_generator/_version.py"
local_scheme = "no-local-version"
fallback_version = "0.0.0+unknown"
# Only consider semver release tags (e.g. 3.7.5) when computing the Python
# package version. Without this, setuptools-scm picks up unrelated tags like
# `plugin-v10.11.0.1` (the Jellyfin plugin's own version stream) and ends up
# producing 4-segment versions that fail the PEP 440 regex.
git_describe_command = ["git", "describe", "--dirty", "--tags", "--long", "--match", "[0-9]*.[0-9]*.[0-9]*"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = [
    "media_preview_generator/_version.py",
    ".venv",
    ".venv-test",
    "htmlcov",
    "tmp_migration_test",
    "docs/design/intro-credits/evidence",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade (modernizes typing, f-strings, etc.)
]
ignore = [
    "E501",  # line-too-long handled by formatter
    "B008",  # function calls in argument defaults (Flask/Depends idiom)
    # UP042 wants the 13 `str, Enum` classes on StrEnum, which changes what str()/f-string give:
    # "ServerType.PLEX" today, "plex" after. Those strings reach logs, settings.json and the API, so the
    # migration is its own change with its own tests, not a side effect of moving the floor to 3.11.
    "UP042",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]  # assert False is fine in tests
"media_preview_generator/gpu/__init__.py" = ["F401"]  # public-API re-export
"media_preview_generator/processing/__init__.py" = ["F401"]  # public-API re-export

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
