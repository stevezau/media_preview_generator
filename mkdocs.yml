site_name: Media Preview Generator
# The one place the public URL lives. Moving to a custom domain = change this line
# + add docs/CNAME. Canonical links, og:url, JSON-LD, sitemap.xml and robots.txt all derive from it.
site_url: https://stevezau.github.io/media_preview_generator/
site_description: >-
  Generate Plex, Emby and Jellyfin video preview thumbnails fast with GPU-accelerated FFmpeg.
  Self-hosted, runs in Docker, free and open source.
site_author: Steve Adams
repo_url: https://github.com/stevezau/media_preview_generator
repo_name: stevezau/media_preview_generator
edit_uri: edit/dev/docs/
copyright: Copyright &copy; Steve Adams. MIT licensed.

docs_dir: docs
exclude_docs: |
  /design/
  /README.md

theme:
  name: material
  custom_dir: docs_theme/overrides
  logo: images/icon.svg
  favicon: images/icon.png
  icon:
    repo: fontawesome/brands/github
  features:
    - content.action.edit
    - content.code.copy
    - navigation.footer
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - toc.follow
  font:
    text: IBM Plex Sans
    code: IBM Plex Mono
  # Colours come from docs/stylesheets/extra.css (the app's navy and amber), so both
  # schemes use primary/accent "custom". The first entry follows the OS setting; the
  # toggle cycles system -> light -> dark.
  palette:
    - media: "(prefers-color-scheme)"
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Follow system setting

extra_css:
  - stylesheets/extra.css

hooks:
  - docs_theme/hooks.py

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
      # GitHub-style slugs ("HDR & Dolby Vision" -> "hdr--dolby-vision") so the in-page
      # anchors the docs already use work on both GitHub and the site.
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  # Renders GitHub alerts (> [!NOTE], > [!TIP], ...) as admonitions, so the same
  # Markdown looks right on GitHub and on the site.
  - github-callouts
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences

validation:
  omitted_files: warn
  absolute_links: info
  unrecognized_links: warn
  anchors: warn

extra:
  # og:image for every page, relative to site_url.
  social_image: images/social-preview.jpg
  author_url: https://github.com/stevezau
  download_url: https://hub.docker.com/r/stevezzau/media_preview_generator
  # Search Console HTML-tag token (same Google account as the shortlist docs).
  google_site_verification: cqlqedFcoobifs1lLaDIdbBPCPurJ-JlDAIVOTs_02k
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/stevezau/media_preview_generator
      name: Source on GitHub
    - icon: fontawesome/brands/docker
      link: https://hub.docker.com/r/stevezzau/media_preview_generator
      name: Docker image on Docker Hub
    - icon: fontawesome/solid/mug-hot
      link: https://ko-fi.com/stevezau
      name: Buy me a coffee

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Compared with Built-ins: comparison.md
  - How-to:
      - Why Plex Previews Are Slow: plex-preview-thumbnails-slow.md
      - Plex Previews with a GPU: plex-preview-thumbnails-gpu.md
      - Faster Jellyfin Trickplay: jellyfin-trickplay-gpu.md
      - Emby BIF Previews with a GPU: emby-bif-thumbnails-gpu.md
      - Previews on Sonarr/Radarr Import: sonarr-radarr-preview-thumbnails.md
      - HDR & Dolby Vision Previews: hdr-dolby-vision-thumbnails.md
  - Guides:
      - Guides & Troubleshooting: guides.md
      - Previews Readiness: guides/previews-readiness.md
  - Multi-Server: multi-server.md
  - Configuration & API Reference: reference.md
  - FAQ: faq.md
