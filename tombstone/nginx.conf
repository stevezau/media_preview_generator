# Tombstone nginx config. Every path nginx needs to write (pid + temp dirs)
# lives under world-writable /tmp so the container runs as ANY uid:gid — root,
# nginx's 101, or the common `user: 1000:1000`. Stock nginx writes these under
# /var/run and /var/cache/nginx (both root-owned), which crash-loops non-root
# users before they ever see the "image moved" page (see issue #277).
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 128; }

http {
    client_body_temp_path /tmp/nginx-client;
    proxy_temp_path       /tmp/nginx-proxy;
    fastcgi_temp_path     /tmp/nginx-fastcgi;
    uwsgi_temp_path       /tmp/nginx-uwsgi;
    scgi_temp_path        /tmp/nginx-scgi;
    access_log off;

    # Serve the "this image moved" page on 8080 for every request, so existing
    # compose port-maps still hit it.
    server {
        listen 8080 default_server;
        server_name _;
        root /usr/share/nginx/html;
        location / { try_files /index.html =404; }
    }
}
