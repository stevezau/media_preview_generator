<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Servers redesign mockup</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
<link rel="stylesheet" href="../shared.css">
<style>
.head { display: flex; align-items: flex-end; gap: 16px; flex-wrap: wrap; }
.head .t { flex: 1; min-width: 220px; }
.head h1 { margin: 0; font-size: 24px; font-weight: 700; display: flex; align-items: center; gap: 10px; }
.head h1 i { color: var(--muted); }
.head p { margin: 4px 0 0; color: var(--muted); }
.spec { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; padding: 8px 12px; border: 1px dashed var(--line-strong); border-radius: var(--radius-sm); color: var(--faint); font-size: 12px; }
.spec b { letter-spacing: .08em; text-transform: uppercase; font-size: 11px; }
.spec .seg { display: inline-flex; }
.sumstrip { display: flex; gap: 8px 18px; flex-wrap: wrap; color: var(--muted); font-size: 13px; align-items: center; }
.sumstrip b { color: var(--text); font-variant-numeric: tabular-nums; }
.sumstrip .sep { width: 1px; height: 14px; background: var(--line-strong); }

/* shared bits */
.vlogo { width: 36px; height: 36px; border-radius: 9px; display: grid; place-items: center; background: var(--panel-2); border: 1px solid var(--line); font-size: 18px; flex: none; }
.vlogo.plex { color: #e5a00d; } .vlogo.emby { color: #52b54b; } .vlogo.jf { color: #5aa0e8; }
.hostline { color: var(--faint); font: 12px var(--mono); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pill.btnlike { border: 0; cursor: pointer; }
.pill.btnlike:hover { filter: brightness(1.15); }
.sw { display: inline-flex; align-items: center; gap: 8px; }
.sw input { position: absolute; opacity: 0; width: 0; height: 0; }
.sw .track { width: 36px; height: 20px; border-radius: 99px; background: var(--line-strong); position: relative; transition: background .16s; cursor: pointer; }
.sw .track::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: transform .16s; }
.sw input:checked + .track { background: var(--accent); }
.sw input:checked + .track::after { transform: translateX(16px); }
.sw input:focus-visible + .track { outline: 2px solid var(--accent); outline-offset: 2px; }
.ibtn:disabled { opacity: .4; cursor: default; }
.segbar { display: flex; gap: 3px; }
.segbar i { flex: 1; height: 6px; border-radius: 3px; background: var(--accent); min-width: 4px; }
.segbar i.x { background: var(--line-strong); }
.segbar.bad i:not(.x) { background: var(--warn); }
.chip { display: inline-flex; align-items: center; height: 22px; padding: 0 8px; border-radius: 6px; background: var(--inset); border: 1px solid var(--line); font-size: 12px; color: var(--muted); white-space: nowrap; }
.chip.x { text-decoration: line-through; opacity: .6; }
.chip.more { border-style: dashed; }
.lastchk { color: var(--faint); font-size: 12px; white-space: nowrap; }
.err-line { color: var(--bad); font-size: 12px; }

/* GRID mode (>= 3 servers): fixed rows header / host / issue / libraries / footer */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 16px; }
.srv { padding: 0; transition: opacity .16s, border-color .16s; display: flex; flex-direction: column; }
.srv:hover { border-color: var(--line-strong); }
.srv.off { opacity: .7; }
.srv-top { display: grid; grid-template-columns: 36px minmax(0,1fr) auto; gap: 12px; padding: 16px 16px 0; align-items: center; height: 52px; box-sizing: content-box; }
.srv-title { display: flex; align-items: center; gap: 8px; min-width: 0; }
.srv-title h3 { margin: 0; font-size: 16px; font-weight: 600; line-height: 1.25; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.srv-host { padding: 8px 16px 0 64px; height: 18px; box-sizing: content-box; }
.srv-issue { padding: 10px 16px 0; height: 24px; display: flex; align-items: center; box-sizing: content-box; }
.srv-lib { margin: 12px 16px 0; }
.libs.sm { padding: 10px 12px; gap: 10px; flex-wrap: wrap; }
.libs.sm .big { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }
.libs.sm .big.warn { color: var(--warn); }
.libs.sm .sub { font-size: 13px; }
.libs.sm .segbar { flex-basis: 100%; }
.srv-foot { display: flex; align-items: center; gap: 4px; padding: 10px 12px 12px; margin-top: auto; }
.srv-foot .sp { flex: 1; }
.srv-foot .lastchk { padding-left: 4px; }
.addtile { border: 1px dashed var(--line-strong); border-radius: var(--radius); background: transparent; color: var(--muted); display: grid; place-items: center; align-content: center; gap: 10px; min-height: 220px; padding: 20px; text-align: center; transition: border-color .16s, color .16s, background .16s; }
.addtile:hover { border-color: var(--accent); color: var(--text); background: var(--accent-soft); }
.addtile .plus { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); font-size: 22px; }
.addtile b { color: var(--text); font-size: 15px; }
.addtile .vs { display: flex; gap: 6px; }
.addtile .vs .vlogo { width: 28px; height: 28px; font-size: 14px; border-radius: 7px; }

/* ROW mode (1-2 servers): roomy full-width cards */
.rows { display: grid; gap: 16px; }
.srow { display: grid; grid-template-columns: minmax(260px, 1.1fr) minmax(280px, 1.5fr) minmax(150px, .7fr) auto; align-items: stretch; transition: opacity .16s, border-color .16s; }
.srow:hover { border-color: var(--line-strong); }
.srow.off { opacity: .7; }
.srow > div { padding: 20px 22px; display: flex; flex-direction: column; gap: 8px; justify-content: center; min-width: 0; }
.srow > div + div { border-left: 1px solid var(--line); }
.srow .id { flex-direction: row; align-items: center; justify-content: flex-start; gap: 14px; }
.srow .id .vlogo { width: 52px; height: 52px; border-radius: 13px; font-size: 26px; }
.srow .id h3 { margin: 0; font-size: 20px; font-weight: 700; line-height: 1.2; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.srow .id .meta { display: grid; gap: 6px; min-width: 0; }
.srow .sl { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
.srow .k { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--faint); }
.srow .libhead { display: flex; align-items: baseline; gap: 8px; }
.srow .libhead .big { font-size: 28px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1; }
.srow .libhead .big.warn { color: var(--warn); }
.srow .libhead span:last-child { color: var(--muted); font-size: 13px; }
.srow .chips { display: flex; gap: 6px; flex-wrap: wrap; }
.srow .health { align-items: flex-start; }
.srow .health .pill { height: 28px; font-size: 13px; padding: 0 12px; }
.srow .health .okline { color: var(--ok); font-weight: 600; display: flex; gap: 6px; align-items: center; }
.srow .health small { color: var(--faint); font-size: 12px; }
.srow .acts { align-items: flex-end; justify-content: space-between; gap: 10px; }
.srow .acts .btns { display: flex; gap: 4px; }
.srow .acts .btn { height: 34px; }
.srow .feat { grid-column: 1 / -1; border-left: 0 !important; border-top: 1px solid var(--line); flex-direction: row !important; align-items: center; justify-content: flex-start; flex-wrap: wrap; gap: 8px 10px !important; padding: 12px 22px !important; background: var(--inset); }
.srow .feat .k { margin-right: 4px; }
.fchip { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border-radius: 99px; border: 1px solid var(--line); font-size: 12.5px; font-weight: 600; color: var(--muted); background: var(--panel); }
.fchip i { font-size: 13px; }
.fchip.pv i { color: var(--t-previews); } .fchip.mk i { color: var(--t-intro); } .fchip.ld i { color: var(--t-loud); } .fchip.ch i { color: var(--faint); }
.fchip.off { opacity: .6; font-weight: 500; }
.fchip .st { font-weight: 500; color: var(--faint); }
.addrow { display: flex; align-items: center; gap: 16px; padding: 18px 22px; border: 1px dashed var(--line-strong); border-radius: var(--radius); color: var(--muted); transition: border-color .16s, background .16s; cursor: pointer; background: transparent; width: 100%; text-align: left; }
.addrow:hover { border-color: var(--accent); background: var(--accent-soft); color: var(--text); }
.addrow .plus { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); font-size: 18px; flex: none; }
.addrow b { color: var(--text); display: block; }
.addrow .sp { flex: 1; }
.addrow .vs { display: flex; gap: 6px; }
.addrow .vs .vlogo { width: 28px; height: 28px; font-size: 14px; border-radius: 7px; }

@media (max-width: 1100px) {
  .srow { grid-template-columns: 1fr 1fr; }
  .srow > div:nth-child(3) { border-left: 0; border-top: 1px solid var(--line); }
  .srow > div:nth-child(2) { border-left: 1px solid var(--line); }
  .srow > div:nth-child(3), .srow > div:nth-child(4) { border-top: 1px solid var(--line); }
  .srow > div:nth-child(3) { border-left: 0; }
}
@media (max-width: 700px) {
  .head .btn { width: 100%; }
  .grid { grid-template-columns: 1fr; }
  .srow { grid-template-columns: 1fr; }
  .srow > div { border-left: 0 !important; }
  .srow > div + div { border-top: 1px solid var(--line); }
  .srow .acts { flex-direction: row; align-items: center; }
  .srow .acts .ibtn, .srv-foot .ibtn { width: 40px; height: 40px; font-size: 17px; }
  .srv-foot .lastchk { display: none; }
  .srv-foot { justify-content: flex-end; }
  .addrow .vs { display: none; }
  .addtile { min-height: 120px; }
}
</style>
</head>
<body>
<header class="nav">
  <a class="brand" href="#"><span class="mark"><i class="bi bi-play-btn-fill"></i></span><span><b>Media Preview Generator</b><small>local build</small></span></a>
  <a class="tab" href="#"><i class="bi bi-speedometer2"></i> Dashboard</a>
  <a class="tab on" href="#"><i class="bi bi-hdd-network"></i> Servers</a>
  <a class="tab" href="#"><i class="bi bi-magic"></i> Automation <i class="bi bi-chevron-down caret"></i></a>
  <a class="tab" href="#"><i class="bi bi-gear"></i> Settings <i class="bi bi-chevron-down caret"></i></a>
  <a class="tab" href="#"><i class="bi bi-wrench"></i> Tools <i class="bi bi-chevron-down caret"></i></a>
  <span class="sp"></span>
  <button class="ibtn" aria-label="Notifications" title="Notifications"><i class="bi bi-bell"></i><span class="badge-dot">1</span></button>
  <button class="ibtn" aria-label="Help" title="Help"><i class="bi bi-question-circle"></i></button>
  <a class="ibtn coffee" href="#" aria-label="Buy me a coffee" title="Buy me a coffee"><i class="bi bi-cup-hot-fill"></i></a>
  <a class="btn sm" href="#"><i class="bi bi-star-fill" style="color:var(--accent)"></i> Star</a>
  <button class="ibtn" aria-label="Toggle theme" title="Toggle theme"><i class="bi bi-moon-stars"></i></button>
  <button class="btn sm"><i class="bi bi-box-arrow-right"></i> Logout</button>
</header>

<main class="page">
  <div class="head">
    <div class="t">
      <h1><i class="bi bi-hdd-network"></i> Media Servers</h1>
      <p>Plex, Emby, and Jellyfin servers this app publishes previews to.</p>
    </div>
    <a class="btn primary" href="server-modal.html?step=type"><i class="bi bi-plus-lg"></i> Add Server</a>
  </div>

  <div class="spec"><b>Spec only</b> Show
    <span class="seg" id="stateSeg">
      <button data-n="1" class="on">1 server</button><button data-n="2">2 servers</button><button data-n="5">5 servers (1 disabled)</button><button data-n="0">None</button>
    </span>
    <span>Rows below 3 servers, grid from 3. The real app picks the layout from the server count.</span>
  </div>

  <div class="sumstrip" id="sumstrip"></div>

  <div id="serverList"></div>
</main>
<button class="btn sm theme" onclick="var r=document.documentElement;r.dataset.theme=r.dataset.theme==='dark'?'light':'dark'"><i class="bi bi-circle-half"></i> Theme</button>
<script>
var S = [
  {id:'mlab-plex', t:'plex', name:'Lab Plex', host:'http://mlab-plex:32400', on:true, ok:true, health:{n:10, kind:'warn'}, libs:['movies','Synth Credits','Synth Movies','Synth Audio','Synth Chapters','tv','Open Films'], en:7, chk:'12s ago', f:{pv:1,mk:1,ld:0,ch:0}},
  {id:'mlab-jellyfin', t:'jf', name:'Lab Jellyfin 10.11', host:'http://mlab-jellyfin:8096', on:true, ok:true, health:{n:14, kind:'bad'}, libs:['movies','tv','Synth Audio','Synth Credits','Synth Chapters','Synth Movies','Open Films','Shorts'], en:8, chk:'12s ago'},
  {id:'mlab-jf12', t:'jf', name:'Lab Jellyfin 12.0', host:'http://mlab-jf12:8096', on:true, ok:true, health:{n:14, kind:'bad'}, libs:['movies','tv','Synth Audio','Synth Credits','Synth Chapters','Synth Movies','Open Films'], en:7, chk:'12s ago'},
  {id:'mlab-emby', t:'emby', name:'Lab Emby', host:'http://mlab-emby:8096', on:true, ok:true, health:null, libs:['movies','tv','Synth Audio','Synth Credits','Synth Chapters','Synth Movies','Open Films','Shorts'], en:8, chk:'12s ago'},
  {id:'backup-plex', t:'plex', name:'Backup Plex', host:'http://backup-plex:32400', on:false, ok:false, err:'Connection refused', health:null, libs:['movies','tv','Music','Home videos','Open Films'], en:3, chk:'2m ago'}
];
var ICON = {plex:'bi-chevron-right', emby:'bi-play-btn-fill', jf:'bi-triangle-fill'};
var VNAME = {plex:'Plex', emby:'Emby', jf:'Jellyfin'};
var TYPE = {plex:'plex', emby:'emby', jf:'jellyfin'};
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function bar(s){var h='';for(var i=0;i<s.libs.length;i++)h+='<i class="'+(i<s.en?'':'x')+'"></i>';return '<div class="segbar'+(s.en<s.libs.length?' bad':'')+'" aria-hidden="true">'+h+'</div>'}
function pill(s){
  if(s.err)return '<span class="pill bad" id="server-error-'+s.id+'"><i class="bi bi-x-circle-fill"></i> '+esc(s.err)+'</span>';
  if(!s.on)return '';
  if(!s.health)return '';
  var bad=s.health.kind==='bad';
  return '<a class="pill '+(bad?'bad':'warn')+' btnlike" href="server-modal.html?type='+TYPE[s.t]+'&tab=health" title="Open setup health" aria-label="Open setup health: '+s.health.n+(bad?' must fix':' to fix')+'"><i class="bi '+(bad?'bi-exclamation-triangle-fill':'bi-exclamation-circle-fill')+'"></i> '+s.health.n+(bad?' must fix':' to fix')+'</a>';
}
function dot(s){var c=s.err?'bad':(s.on?'ok':''),l=s.err?s.err:(s.on?'Connected':'Disabled');return '<span class="dot '+c+'" id="server-status-'+s.id+'" role="img" aria-label="'+esc(l)+'" title="'+esc(l)+'"></span>'}
function sw(s){return '<label class="sw"><input type="checkbox" class="server-enabled-toggle" '+(s.on?'checked':'')+' aria-label="Enabled"><span class="track"></span></label>'}
function acts(s){var e='server-modal.html?type='+TYPE[s.t];return '<a class="ibtn edit-server-btn" href="'+e+'" aria-label="Edit '+esc(s.name)+'" title="Edit"><i class="bi bi-pencil"></i></a><button class="ibtn refresh-libraries-btn" aria-label="Refresh libraries" title="'+(s.err?'Refresh libraries (server unreachable)':'Refresh libraries')+'"'+(s.err?' disabled':'')+'><i class="bi bi-arrow-clockwise"></i></button><button class="ibtn danger delete-server-btn" aria-label="Delete '+esc(s.name)+'" title="Delete"><i class="bi bi-trash"></i></button>'}
function card(s){
  return '<article class="panel srv'+(s.on?'':' off')+'" data-id="'+s.id+'">'
  +'<div class="srv-top"><span class="vlogo '+s.t+'"><i class="bi '+ICON[s.t]+'"></i></span><div class="srv-title">'+dot(s)+'<h3>'+esc(s.name)+'</h3></div>'+sw(s)+'</div>'
  +'<div class="srv-host"><div class="hostline" title="'+s.host+'">'+s.host+'</div></div>'
  +'<div class="srv-issue">'+pill(s)+'</div>'
  +'<div class="srv-lib"><div class="libs sm"><span class="big'+(s.en<s.libs.length?' warn':'')+'">'+s.en+'</span><span class="sub">of '+s.libs.length+' libraries enabled</span>'+bar(s)+'</div></div>'
  +'<div class="srv-foot"><span class="lastchk">Checked '+s.chk+'</span><span class="sp"></span>'+acts(s)+'</div></article>';
}
function feat(s){
  var f=s.f||{pv:1,mk:s.t==='emby'?1:1};
  var c=function(k,ic,l,on){return '<span class="fchip '+k+(on?'':' off')+'"><i class="bi '+ic+'"></i>'+l+' <span class="st">'+(on?'on':'off')+'</span></span>'};
  var h='<div class="feat"><span class="k">Sends</span>'+c('pv','bi-images','Previews',f.pv)+c('mk','bi-skip-forward-fill','Intro &amp; Credits',f.mk);
  if(s.t==='plex')h+=c('ld','bi-volume-up','Loudness',f.ld)+c('ch','bi-card-image','Chapter thumbnails',f.ch);
  return h+'</div>';
}
function row(s){
  var shown=s.libs.slice(0,6),chips=shown.map(function(n,i){return '<span class="chip'+(i<s.en?'':' x')+'">'+esc(n)+'</span>'}).join('');
  if(s.libs.length>6)chips+='<span class="chip more">+'+(s.libs.length-6)+' more</span>';
  var h=pill(s)||(s.on?'<span class="okline"><i class="bi bi-check-circle-fill"></i> Setup is healthy</span>':'<span class="sl">Not checked while disabled</span>');
  return '<article class="panel srow'+(s.on?'':' off')+'" data-id="'+s.id+'">'
  +'<div class="id"><span class="vlogo '+s.t+'"><i class="bi '+ICON[s.t]+'"></i></span><div class="meta"><h3>'+esc(s.name)+'</h3>'
    +'<div class="sl">'+dot(s)+'<span>'+(s.err?esc(s.err):(s.on?'Connected':'Disabled'))+'</span><span class="lastchk">· '+VNAME[s.t]+' · checked '+s.chk+'</span></div>'
    +'<div class="hostline" title="'+s.host+'">'+s.host+'</div></div></div>'
  +'<div><span class="k">Libraries</span><div class="libhead"><span class="big'+(s.en<s.libs.length?' warn':'')+'">'+s.en+'</span><span>of '+s.libs.length+' enabled</span></div>'+bar(s)+'<div class="chips">'+chips+'</div></div>'
  +'<div class="health"><span class="k">Setup health</span>'+h+'<small>'+(s.health?'Open to review and fix':(s.on?'Checked '+s.chk:''))+'</small></div>'
  +'<div class="acts">'+sw(s)+'<div class="btns">'+acts(s)+'</div></div>'+feat(s)+'</article>';
}
function addTile(){return '<a class="addtile" href="server-modal.html?step=type"><span class="plus"><i class="bi bi-plus-lg"></i></span><b>Add server</b><span>Connect another Plex, Emby or Jellyfin.</span><span class="vs"><span class="vlogo plex"><i class="bi bi-chevron-right"></i></span><span class="vlogo emby"><i class="bi bi-play-btn-fill"></i></span><span class="vlogo jf"><i class="bi bi-triangle-fill"></i></span></span></a>'}
function addRow(){return '<a class="addrow" href="server-modal.html?step=type"><span class="plus"><i class="bi bi-plus-lg"></i></span><span><b>Add another server</b>Plex, Emby or Jellyfin. Frames are extracted once and reused across servers.</span><span class="sp"></span><span class="vs"><span class="vlogo plex"><i class="bi bi-chevron-right"></i></span><span class="vlogo emby"><i class="bi bi-play-btn-fill"></i></span><span class="vlogo jf"><i class="bi bi-triangle-fill"></i></span></span></a>'}
function render(n){
  var list=S.slice(0,n); if(n===1)list=[S[0]]; if(n===2)list=[S[0],S[3]];
  var el=document.getElementById('serverList');
  if(!list.length){el.innerHTML='<div class="empty" style="border:1px dashed var(--line-strong);border-radius:var(--radius);padding:48px 20px;text-align:center;display:grid;gap:10px;justify-items:center;color:var(--muted)"><span class="vlogo" style="width:48px;height:48px;font-size:22px"><i class="bi bi-hdd-network"></i></span><b style="color:var(--text);font-size:16px">No servers yet</b><span>Connect Plex, Emby or Jellyfin to start generating previews.</span><a class="btn primary" href="server-modal.html?step=type"><i class="bi bi-plus-lg"></i> Add Server</a></div>';document.getElementById('sumstrip').innerHTML='';return}
  if(list.length>=3)el.innerHTML='<div class="grid">'+list.map(card).join('')+addTile()+'</div>';
  else el.innerHTML='<div class="rows">'+list.map(row).join('')+addRow()+'</div>';
  var libs=list.reduce(function(a,s){return a+s.en},0),att=list.filter(function(s){return s.on&&s.health||s.err}).length;
  document.getElementById('sumstrip').innerHTML='<span><b>'+list.length+'</b> '+(list.length===1?'server':'servers')+'</span><span class="sep"></span><span><b>'+libs+'</b> libraries enabled</span><span class="sep"></span><span>'+(att?'<b style="color:var(--warn)">'+att+'</b> need attention':'<b style="color:var(--ok)">All</b> healthy')+'</span>';
  document.querySelectorAll('.sw input').forEach(function(cb){cb.addEventListener('change',function(){cb.closest('.panel').classList.toggle('off',!cb.checked)})});
}
document.querySelectorAll('#stateSeg button').forEach(function(b){b.addEventListener('click',function(){document.querySelectorAll('#stateSeg button').forEach(function(x){x.classList.toggle('on',x===b)});render(+b.dataset.n)})});
var q=new URLSearchParams(location.search).get('n');render(q!==null?+q:1);
if(q!==null)document.querySelectorAll('#stateSeg button').forEach(function(x){x.classList.toggle('on',x.dataset.n===q)});
</script>
</body>
</html>
