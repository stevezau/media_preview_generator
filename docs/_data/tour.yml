# The landing page's tour: what happens to one new file, in order, each step beside the screen where
# it happens. Captured by tests/e2e/snapshots/regen_readme.py against a fixture (fake servers, the lab
# films as titles). width/height are the CSS size the page reserves: half the 2x capture's pixels.
# `path` is the app path shown in the frame's address bar.
- title: A new file arrives
  body: >-
    Sonarr, Radarr, Tdarr or the media server itself sends a webhook when a file lands, to the URL the
    Automation page gives it. Scheduled scans and a hand-picked list work too.
  image: tour-trigger.webp
  alt: "The Automation page's *arr apps card with Sonarr, Radarr and Sportarr tabs, a Publish to which server? choice and the Sonarr webhook URL"
  path: /automation
  width: 1070
  height: 600
- title: It finds every server with that file
  body: >-
    The path Sonarr reports is mapped to the path the container sees. Then every Plex, Emby and
    Jellyfin library that holds the file is found.
  image: tour-resolve.webp
  alt: "The Servers page with one card each for Home Plex, Home Jellyfin and Home Emby, each showing its address and enabled libraries"
  path: /servers
  width: 1280
  height: 528
- title: One GPU pass per file
  body: >-
    FFmpeg decodes the video on the GPU, jumps between key frames when the file allows it, and
    tone-maps HDR. If the GPU can't decode a file, the same worker tries again on the CPU.
  image: tour-extract.webp
  alt: "Workers panel as a table: busy GPU and CPU workers with percent, speed and ETA, idle workers folded into one line"
  path: /
  width: 1280
  height: 698
- title: Each server gets its own format
  body: >-
    A BIF in Plex's data folder, a BIF next to the video for Emby, trickplay tiles for Jellyfin. Then
    each server is told to pick them up.
  image: tour-publish.webp
  alt: "A completed job's details with the Files tab open: one file marked Generated, with Home Plex, Home Jellyfin and Home Emby listed as its servers"
  path: /
  width: 1168
  height: 552
- title: It waits for slow servers
  body: >-
    A server that hasn't indexed the new file yet gets another try after 1, 2, 5, 15 and 60
    minutes by default. Next time, files whose previews are current are skipped.
  image: tour-retry.webp
  alt: "The Jobs queue with four rows: Tears of Steel running at 62%, Sintel pending with Retry 2/5 and Retry starting in 4 min, Big Buck Bunny completed, and Elephants Dream pending"
  path: /
  width: 1280
  height: 585
